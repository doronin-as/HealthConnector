name: Patch manual sync double tap

on:
  push:
    branches:
      - fix/manual-sync-double-tap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-sync-double-tap
          fetch-depth: 0

      - name: Patch duplicate manual sync handling
        shell: python
        run: |
          from pathlib import Path
          runtime = Path('app/src/main/java/ru/doronin/healthconnector/SyncRuntime.kt')
          text = runtime.read_text()
          old = '    suspend fun <T> runManual(onWaiting: (String?) -> Unit, block: suspend () -> T): T {\n        if (mutex.isLocked) onWaiting(currentOrigin)\n        mutex.lock()\n'
          new = '    suspend fun <T> runManual(onWaiting: (String?) -> Unit, block: suspend () -> T): T? {\n        // A second manual tap must not queue another full sync or overwrite the\n        // progress text of the manual sync that is already running.\n        if (mutex.isLocked && currentOrigin == "manual") return null\n        if (mutex.isLocked) onWaiting(currentOrigin)\n        mutex.lock()\n'
          if old not in text: raise SystemExit('SyncRuntime target not found')
          runtime.write_text(text.replace(old, new, 1))
          activity = Path('app/src/main/java/ru/doronin/healthconnector/StreamingMainActivity.kt')
          text = activity.read_text()
          old = '        }.onSuccess { result ->\n            binding.status.text =\n                "Синхронизация завершена: дней ${result.days}, тренировок ${result.workouts}, " +\n                    "измерений ${result.measurements}, источников ${result.sources}"\n'
          new = '        }.onSuccess { result ->\n            // null means the user tapped sync again while the existing manual run\n            // is still active. Keep that run\'s live progress visible and do nothing.\n            if (result == null) return@onSuccess\n            binding.status.text =\n                "Синхронизация завершена: дней ${result.days}, тренировок ${result.workouts}, " +\n                    "измерений ${result.measurements}, источников ${result.sources}"\n'
          if old not in text: raise SystemExit('StreamingMainActivity target not found')
          activity.write_text(text.replace(old, new, 1))
          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text()
          if 'versionCode = 25' not in text or 'versionName = "1.6.11"' not in text: raise SystemExit('Version target not found')
          text = text.replace('versionCode = 25', 'versionCode = 26', 1)
          text = text.replace('versionName = "1.6.11"', 'versionName = "1.6.12"', 1)
          gradle.write_text(text)

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ru/doronin/healthconnector/SyncRuntime.kt app/src/main/java/ru/doronin/healthconnector/StreamingMainActivity.kt app/build.gradle.kts
          git commit -m "Ignore duplicate manual sync taps"
          git push origin HEAD:fix/manual-sync-double-tap
