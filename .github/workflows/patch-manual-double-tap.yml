name: Patch manual sync double tap

on:
  push:
    branches:
      - fix/manual-sync-double-tap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-sync-double-tap
          fetch-depth: 0

      - name: Patch duplicate manual sync handling
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('app/src/main/java/ru/doronin/healthconnector/SyncRuntime.kt')
          text = runtime.read_text()
          old = '''    suspend fun <T> runManual(onWaiting: (String?) -> Unit, block: suspend () -> T): T {
        if (mutex.isLocked) onWaiting(currentOrigin)
        mutex.lock()
'''
          new = '''    suspend fun <T> runManual(onWaiting: (String?) -> Unit, block: suspend () -> T): T? {
        // A second manual tap must not queue another full sync or overwrite the
        // progress text of the manual sync that is already running.
        if (mutex.isLocked && currentOrigin == "manual") return null
        if (mutex.isLocked) onWaiting(currentOrigin)
        mutex.lock()
'''
          if old not in text:
              raise SystemExit('SyncRuntime target not found')
          runtime.write_text(text.replace(old, new, 1))

          activity = Path('app/src/main/java/ru/doronin/healthconnector/StreamingMainActivity.kt')
          text = activity.read_text()
          old = '''        }.onSuccess { result ->
            binding.status.text =
                "Синхронизация завершена: дней ${result.days}, тренировок ${result.workouts}, " +
                    "измерений ${result.measurements}, источников ${result.sources}"
'''
          new = '''        }.onSuccess { result ->
            // null means the user tapped sync again while the existing manual run
            // is still active. Keep that run's live progress visible and do nothing.
            if (result == null) return@onSuccess
            binding.status.text =
                "Синхронизация завершена: дней ${result.days}, тренировок ${result.workouts}, " +
                    "измерений ${result.measurements}, источников ${result.sources}"
'''
          if old not in text:
              raise SystemExit('StreamingMainActivity target not found')
          activity.write_text(text.replace(old, new, 1))

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('versionCode = 25', 'versionCode = 26', 1)
          text = text.replace('versionName = "1.6.11"', 'versionName = "1.6.12"', 1)
          gradle.write_text(text)

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ru/doronin/healthconnector/SyncRuntime.kt \
                  app/src/main/java/ru/doronin/healthconnector/StreamingMainActivity.kt \
                  app/build.gradle.kts
          git commit -m "Ignore duplicate manual sync taps"
          git push origin HEAD:fix/manual-sync-double-tap
