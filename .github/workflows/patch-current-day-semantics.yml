name: Patch current day semantics

on:
  push:
    branches:
      - 'fix/table-driven-sync-plan'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'fix/table-driven-sync-plan'
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch_current_day_semantics.py
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/Code.gs app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt
          git commit -m 'Keep current day incomplete until next day'
          git push origin HEAD:fix/table-driven-sync-plan
