name: Build temporary signed APK

on:
  push:
    branches: [ build/temp-apk-1.6.16 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HC_SIGNING_STORE_FILE: /tmp/healthconnector-temp.keystore
      HC_SIGNING_KEY_ALIAS: healthconnector-temp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate temporary signing key
        run: |
          PASS="$(openssl rand -hex 18)"
          echo "HC_SIGNING_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "HC_SIGNING_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore "$HC_SIGNING_STORE_FILE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias "$HC_SIGNING_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=HealthConnector Temporary Build,O=HealthConnector,C=DE"
      - name: Run unit tests
        run: gradle :app:testReleaseUnitTest --stacktrace
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk HealthConnector-1.6.16-side-by-side.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HealthConnector-1.6.16-side-by-side
          path: HealthConnector-1.6.16-side-by-side.apk
          retention-days: 1
