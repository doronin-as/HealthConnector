name: Patch data integrity 1.6.0

on:
  push:
    paths:
      - '.github/trigger-integrity-160'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python3 tools/patch_integrity_160.py
      - name: Validate patch
        run: |
          git diff --check
          grep -F 'versionName = "1.6.0"' app/build.gradle.kts
          grep -F 'healthSyncV3' app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt app/build.gradle.kts
          git commit -m 'Implement 1.6.0 data integrity sync'
          git push origin HEAD:main
