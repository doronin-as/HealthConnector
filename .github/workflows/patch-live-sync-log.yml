name: Patch live sync diagnostics

on:
  push:
    branches:
      - fix/manual-sync-double-tap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-sync-double-tap
          fetch-depth: 0

      - name: Add live sync diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label}: target not found')
              return text.replace(old, new, 1)

          runtime = Path('app/src/main/java/ru/doronin/healthconnector/SyncRuntime.kt')
          text = runtime.read_text()
          text = replace_once(
              text,
              'import android.content.Context\nimport android.view.View\n',
              'import android.content.Context\nimport android.os.Handler\nimport android.os.Looper\nimport android.view.View\n',
              'runtime imports'
          )
          text = replace_once(text, 'private const val MAX_EVENTS = 120', 'private const val MAX_EVENTS = 300', 'max events')
          text = replace_once(text, '        }.takeLast(35)\n', '        }.takeLast(80).asReversed()\n', 'latest events first')
          start = text.index('    fun updateHeader() {')
          end_marker = '    parent.addView(details)\n'
          end = text.index(end_marker, start) + len(end_marker)
          new = (
              '    val handler = Handler(Looper.getMainLooper())\n'
              '    val refresher = object : Runnable {\n'
              '        override fun run() {\n'
              '            if (details.visibility == View.VISIBLE && details.isAttachedToWindow) {\n'
              '                details.text = detailsProvider()\n'
              '                handler.postDelayed(this, 2_000L)\n'
              '            }\n'
              '        }\n'
              '    }\n'
              '    fun updateHeader() {\n'
              '        header.text = (if (details.visibility == View.VISIBLE) "▼ " else "▶ ") + title\n'
              '    }\n'
              '    updateHeader()\n'
              '    header.setOnClickListener {\n'
              '        details.visibility = if (details.visibility == View.VISIBLE) View.GONE else View.VISIBLE\n'
              '        handler.removeCallbacks(refresher)\n'
              '        if (details.visibility == View.VISIBLE) {\n'
              '            details.text = detailsProvider()\n'
              '            handler.postDelayed(refresher, 2_000L)\n'
              '        }\n'
              '        updateHeader()\n'
              '    }\n'
              '    details.addOnAttachStateChangeListener(object : View.OnAttachStateChangeListener {\n'
              '        override fun onViewAttachedToWindow(v: View) = Unit\n'
              '        override fun onViewDetachedFromWindow(v: View) {\n'
              '            handler.removeCallbacks(refresher)\n'
              '        }\n'
              '    })\n'
              '    parent.addView(header)\n'
              '    parent.addView(details)\n'
          )
          text = text[:start] + new + text[end:]
          runtime.write_text(text)

          activity = Path('app/src/main/java/ru/doronin/healthconnector/StreamingMainActivity.kt')
          text = activity.read_text()
          text = replace_once(
              text,
              'import android.os.Bundle\n',
              'import android.os.Bundle\nimport android.os.SystemClock\n',
              'activity SystemClock import'
          )
          text = replace_once(
              text,
              'import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.launch\nimport kotlinx.coroutines.withContext\n',
              'import kotlinx.coroutines.CancellationException\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.delay\nimport kotlinx.coroutines.isActive\nimport kotlinx.coroutines.launch\nimport kotlinx.coroutines.withContext\n',
              'activity coroutine imports'
          )
          old = '''                val runId = SyncDiagnostics.begin(this, "manual")
                          try {
                              val streamer = HealthSyncStreamer(this, client)
                              val result = streamer.sync(
                                  settings.endpoint,
                                  settings.token,
                                  settings.days,
                                  includeHistoricalChanges = true
                              ) { message ->
                                  SyncDiagnostics.progress(this, runId, "manual", message)
                                  binding.status.text = message
                              }
                              SyncDiagnostics.finish(
                                  this,
                                  runId,
                                  "manual",
                                  "Дней ${result.days}, тренировок ${result.workouts}, измерений ${result.measurements}"
                              )
                              result
                          } catch (error: Throwable) {
                              SyncDiagnostics.failure(this, runId, "manual", error)
                              throw error
                          }
          '''
          new = '''                val runId = SyncDiagnostics.begin(this, "manual")
                          val syncStartedAt = SystemClock.elapsedRealtime()
                          var lastProgressMessage = "Запуск синхронизации…"
                          val heartbeat = lifecycleScope.launch {
                              while (isActive) {
                                  delay(5_000L)
                                  val elapsedSec = (SystemClock.elapsedRealtime() - syncStartedAt) / 1000L
                                  binding.status.text = "$lastProgressMessage\\n● Процесс идёт · ${elapsedSec} с"
                              }
                          }
                          try {
                              val streamer = HealthSyncStreamer(this, client)
                              val result = streamer.sync(
                                  settings.endpoint,
                                  settings.token,
                                  settings.days,
                                  includeHistoricalChanges = true
                              ) { message ->
                                  lastProgressMessage = message
                                  val elapsedSec = (SystemClock.elapsedRealtime() - syncStartedAt) / 1000L
                                  SyncDiagnostics.progress(this, runId, "manual", message)
                                  binding.status.text = "$message\\n● Процесс идёт · ${elapsedSec} с"
                              }
                              SyncDiagnostics.finish(
                                  this,
                                  runId,
                                  "manual",
                                  "Дней ${result.days}, тренировок ${result.workouts}, измерений ${result.measurements}"
                              )
                              result
                          } catch (cancelled: CancellationException) {
                              SyncDiagnostics.skipped(this, "manual", "Ручная синхронизация отменена системой или закрытием экрана")
                              throw cancelled
                          } catch (error: Throwable) {
                              SyncDiagnostics.failure(this, runId, "manual", error)
                              throw error
                          } finally {
                              heartbeat.cancel()
                          }
          '''
          text = replace_once(text, old, new, 'manual heartbeat')
          activity.write_text(text)

          streamer = Path('app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt')
          text = streamer.read_text()

          text = replace_once(
              text,
              '        val sleepSessions = JSONArray()\n        val workouts = JSONArray()\n\n        val batcher = MeasurementBatcher(MAX_MEASUREMENTS_PER_REQUEST) { batch ->\n            onProgress("Отправляю измерения за $date…")\n',
              '''        val sleepSessions = JSONArray()
          val workouts = JSONArray()

          var sentBatches = 0
          var sentMeasurements = 0
          val batcher = MeasurementBatcher(MAX_MEASUREMENTS_PER_REQUEST) { batch ->
              val batchSize = batch.length()
              val batchNumber = sentBatches + 1
              onProgress("[$date] Google Sheets: отправляю пачку #$batchNumber · $batchSize изм. · уже отправлено $sentMeasurements")
          ''',
              'batch start detail'
          )
          text = replace_once(
              text,
              '''                sources = sources
                      )
                  }

                  suspend fun emit(
          ''',
              '''                sources = sources
                      )
                      sentBatches = batchNumber
                      sentMeasurements += batchSize
                      onProgress("[$date] ✓ Пачка #$sentBatches принята · всего отправлено $sentMeasurements измерений")
                  }

                  suspend fun emit(
          ''',
              'batch success detail'
          )

          text = replace_once(
              text,
              '        val aggregates = aggregateReader.readDay(dayStart, dayEnd)\n',
              '        onProgress("[$date] Этап 1/8 · читаю дневные агрегаты Health Connect…")\n        val aggregates = aggregateReader.readDay(dayStart, dayEnd)\n',
              'aggregate start'
          )
          text = replace_once(
              text,
              '        val floorsClimbed = metricValue(aggregates.floors, sources)\n\n',
              '        val floorsClimbed = metricValue(aggregates.floors, sources)\n        onProgress("[$date] Агрегаты готовы · шаги ${stepsTotal ?: "—"} · дистанция ${distanceKm?.let { "%.2f".format(it) } ?: "—"} км")\n\n',
              'aggregate ready'
          )

          replacements = [
              ('            workoutDayRecords.steps = safeReadAll<StepsRecord>(dayStart, dayEnd)\n            val records = workoutDayRecords.steps\n',
               '            onProgress("[$date] Этап 2/8 · читаю интервалы шагов…")\n            workoutDayRecords.steps = safeReadAll<StepsRecord>(dayStart, dayEnd)\n            val records = workoutDayRecords.steps\n            onProgress("[$date] Шаги · найдено ${records.size} записей")\n'),
              ('            workoutDayRecords.distance = safeReadAll<DistanceRecord>(dayStart, dayEnd)\n            val records = workoutDayRecords.distance\n',
               '            onProgress("[$date] Читаю дистанцию…")\n            workoutDayRecords.distance = safeReadAll<DistanceRecord>(dayStart, dayEnd)\n            val records = workoutDayRecords.distance\n            onProgress("[$date] Дистанция · найдено ${records.size} записей")\n'),
              ('            workoutDayRecords.activeCalories = safeReadAll<ActiveCaloriesBurnedRecord>(dayStart, dayEnd)\n            val records = workoutDayRecords.activeCalories\n',
               '            onProgress("[$date] Читаю активные калории…")\n            workoutDayRecords.activeCalories = safeReadAll<ActiveCaloriesBurnedRecord>(dayStart, dayEnd)\n            val records = workoutDayRecords.activeCalories\n            onProgress("[$date] Активные калории · найдено ${records.size} записей")\n'),
              ('            workoutDayRecords.totalCalories = safeReadAll<TotalCaloriesBurnedRecord>(dayStart, dayEnd)\n            val records = workoutDayRecords.totalCalories\n',
               '            onProgress("[$date] Читаю общие калории…")\n            workoutDayRecords.totalCalories = safeReadAll<TotalCaloriesBurnedRecord>(dayStart, dayEnd)\n            val records = workoutDayRecords.totalCalories\n            onProgress("[$date] Общие калории · найдено ${records.size} записей")\n'),
              ('            val sleepQueryStart = dayStart.minus(Duration.ofHours(24))\n            val records = safeReadAll<SleepSessionRecord>(sleepQueryStart, dayEnd)\n',
               '            onProgress("[$date] Этап 3/8 · читаю сон…")\n            val sleepQueryStart = dayStart.minus(Duration.ofHours(24))\n            val records = safeReadAll<SleepSessionRecord>(sleepQueryStart, dayEnd)\n'),
              ('            sleepSummary = aggregateSleep(records)\n',
               '            sleepSummary = aggregateSleep(records)\n            onProgress("[$date] Сон · ${records.size} сесс. · ${sleepSummary.stageCount} стадий · ${sleepSummary.hours?.let { "%.2f".format(it) } ?: "—"} ч")\n'),
              ('            onProgress("Сохраняю раннюю сводку за $date…")\n',
               '            onProgress("[$date] Этап 4/8 · сохраняю раннюю сводку и сон…")\n'),
              ('                sources = sources\n            )\n        }\n\n        // High-frequency data',
               '                sources = sources\n            )\n            onProgress("[$date] ✓ Ранняя сводка сохранена · теперь сырые измерения")\n        }\n\n        // High-frequency data'),
              ('            workoutDayRecords.heartRate = safeReadAll<HeartRateRecord>(dayStart, dayEnd)\n            val records = preferBestSource(workoutDayRecords.heartRate)\n',
               '            onProgress("[$date] Этап 5/8 · читаю пульс…")\n            workoutDayRecords.heartRate = safeReadAll<HeartRateRecord>(dayStart, dayEnd)\n            val records = preferBestSource(workoutDayRecords.heartRate)\n            onProgress("[$date] Пульс · ${records.size} серий · ${records.sumOf { it.samples.size }} отсчётов")\n'),
              ('            val records = preferBestSource(safeReadAll<RestingHeartRateRecord>(dayStart, dayEnd))\n',
               '            onProgress("[$date] Читаю пульс покоя…")\n            val records = preferBestSource(safeReadAll<RestingHeartRateRecord>(dayStart, dayEnd))\n'),
              ('            val records = preferBestSource(safeReadAll<HeartRateVariabilityRmssdRecord>(dayStart, dayEnd))\n',
               '            onProgress("[$date] Читаю HRV…")\n            val records = preferBestSource(safeReadAll<HeartRateVariabilityRmssdRecord>(dayStart, dayEnd))\n'),
              ('            val records = preferBestSource(safeReadAll<OxygenSaturationRecord>(dayStart, dayEnd))\n',
               '            onProgress("[$date] Читаю SpO₂…")\n            val records = preferBestSource(safeReadAll<OxygenSaturationRecord>(dayStart, dayEnd))\n'),
              ('            val records = preferBestSource(safeReadAll<RespiratoryRateRecord>(dayStart, dayEnd))\n',
               '            onProgress("[$date] Читаю частоту дыхания…")\n            val records = preferBestSource(safeReadAll<RespiratoryRateRecord>(dayStart, dayEnd))\n'),
              ('            workoutDayRecords.speed = safeReadAll<SpeedRecord>(dayStart, dayEnd)\n',
               '            onProgress("[$date] Этап 6/8 · читаю скорость и каденс…")\n            workoutDayRecords.speed = safeReadAll<SpeedRecord>(dayStart, dayEnd)\n'),
              ('        val workoutRecords = preferBestSource(safeReadAll<ExerciseSessionRecord>(dayStart, dayEnd))\n',
               '        onProgress("[$date] Этап 7/8 · собираю тренировки…")\n        val workoutRecords = preferBestSource(safeReadAll<ExerciseSessionRecord>(dayStart, dayEnd))\n'),
              ('// Make sure the final partial measurement batch is persisted before the day summary.\nbatcher.flush()\n',
               '// Make sure the final partial measurement batch is persisted before the day summary.\n        onProgress("[$date] Финализирую очередь измерений · накоплено ${batcher.totalCount}…")\n        batcher.flush()\n        onProgress("[$date] ✓ Все измерения отправлены · ${batcher.totalCount} изм. · $sentBatches пачек")\n'),
              ('        onProgress("Отправляю сводку за $date…")\n',
               '        onProgress("[$date] Этап 8/8 · отправляю итоговую сводку · тренировок ${workoutRecords.size}…")\n'),
              ('            sources = sources\n        )\n\n        return DayResult(',
               '            sources = sources\n        )\n        onProgress("[$date] ✓ День полностью синхронизирован · ${batcher.totalCount} изм. · ${workoutRecords.size} трен.")\n\n        return DayResult('),
          ]
          for idx, (old, new) in enumerate(replacements, 1):
              text = replace_once(text, old, new, f'streamer detail {idx}')

          streamer.write_text(text)

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text()
          text = replace_once(text, 'versionCode = 26', 'versionCode = 27', 'version code')
          text = replace_once(text, 'versionName = "1.6.12"', 'versionName = "1.6.13"', 'version name')
          gradle.write_text(text)
          PY

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ru/doronin/healthconnector/SyncRuntime.kt \
                  app/src/main/java/ru/doronin/healthconnector/StreamingMainActivity.kt \
                  app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt \
                  app/build.gradle.kts
          git commit -m "Add live detailed sync diagnostics"
          git push origin HEAD:fix/manual-sync-double-tap
