name: Fix version badge build

on:
  push:
    branches: [ feat/version-badge ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/version-badge
      - name: Replace BuildConfig usage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ru/doronin/healthconnector/StreamingMainActivity.kt')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '        val isTestBuild = BuildConfig.APPLICATION_ID != "ru.doronin.healthconnector.stable"\n        val badgeText = buildString {\n            append("v")\n            append(BuildConfig.VERSION_NAME)\n',
              '        val isTestBuild = packageName != "ru.doronin.healthconnector.stable"\n        val versionName = packageManager.getPackageInfo(packageName, 0).versionName ?: "?"\n        val badgeText = buildString {\n            append("v")\n            append(versionName)\n',
              1,
          )
          if 'BuildConfig.' in text:
              raise SystemExit('BuildConfig reference still present')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/doronin/healthconnector/StreamingMainActivity.kt
          git diff --cached --check
          git commit -m 'Read version badge from installed package'
          git push origin HEAD:feat/version-badge
