name: Patch Dashboard devices 1.6.19

on:
  push:
    branches: [ feat/dashboard-devices-1.6.19 ]
    paths:
      - 'tools/patch_dashboard_devices_1619.py'
      - '.github/workflows/patch-dashboard-devices-1619.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dashboard-devices-1.6.19
      - name: Apply patch
        run: python3 tools/patch_dashboard_devices_1619.py
      - name: Commit changes
        run: |
          git config user.name "Alexander"
          git config user.email "53084491+doronin-as@users.noreply.github.com"
          git add app/src/main/java/ru/doronin/healthconnector/StreamingMainActivity.kt apps-script/Code.gs
          if git diff --cached --quiet; then
            echo "Patch already applied"
          else
            git commit -m "Add in-app Dashboard, devices and profile sync"
            git push origin feat/dashboard-devices-1.6.19
          fi
