name: Patch multi-session sleep for 1.5.7

on:
  push:
    paths:
      - '.github/trigger-multisleep-157'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch sleep attribution and aggregation
        run: |
          echo '' | base64 -d > /tmp/patch_multisleep.py
          python3 /tmp/patch_multisleep.py

      - name: Commit multi-session sleep support
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt
          git diff --cached --check
          git commit -m 'Handle multiple sleep sessions by wake date'
          git push origin HEAD:main
