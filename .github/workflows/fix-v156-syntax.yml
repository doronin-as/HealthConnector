name: Finalize Health Connector 1.5.6

on:
  push:
    paths:
      - '.github/trigger-v156-syntax'

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Kotlin string escaping
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt')
          s = p.read_text()
          old = '${lastError?.message ?: \\"неизвестная ошибка\\"}'
          new = '${lastError?.message ?: "неизвестная ошибка"}'
          if old not in s:
              raise SystemExit('Escaped Kotlin template not found; refusing unsafe patch')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit syntax fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt
          git diff --cached --check
          git commit -m 'Fix 1.5.6 Kotlin error message escaping'
          git push origin HEAD:main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable development signing key
        run: |
          base64 --decode .github/signing/healthconnector-dev.keystore.b64 > app/healthconnector-dev.keystore
          chmod 600 app/healthconnector-dev.keystore
          keytool -list -v \
            -keystore app/healthconnector-dev.keystore \
            -storepass android \
            -alias androiddebugkey | grep -F "31:9C:0E:19:44:72:7B:A1:12:8E:6A:83:40:BD:68:12:3B:9E:8B:2C:F3:28:B0:44:3E:1E:4A:03:87:A8:5A:80"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-certs.txt
          grep -F "319c0e1944727ba1128e6a8340bd68123b9e8b2cf328b0443e1e4a0387a85a80" /tmp/apk-certs.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: health-connector-1.5.6
          path: app/build/outputs/apk/debug/app-debug.apk
