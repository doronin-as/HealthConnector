name: Patch Xiaomi scale 1.6.18

on:
  push:
    branches: [ feat/xiaomi-scale-1.6.18 ]
    paths:
      - 'tools/patch_xiaomi_scale_1618.py'
      - '.github/workflows/patch-xiaomi-scale-1618.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xiaomi-scale-1.6.18
      - name: Apply patch
        run: python3 tools/patch_xiaomi_scale_1618.py
      - name: Commit changes
        run: |
          git config user.name "Alexander"
          git config user.email "53084491+doronin-as@users.noreply.github.com"
          git add app/src/main/java/ru/doronin/healthconnector/StreamingMainActivity.kt apps-script/Code.gs
          if git diff --cached --quiet; then
            echo "Patch already applied"
          else
            git commit -m "Integrate Xiaomi scale with Dashboard"
            git push origin feat/xiaomi-scale-1.6.18
          fi
