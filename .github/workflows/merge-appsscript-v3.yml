name: Merge Apps Script v3 into Code.gs

on:
  push:
    paths:
      - '.github/trigger-merge-appsscript-v3'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge V3 integrity layer
        run: |
          printf '\n\n// ===== Health Connector schema v3 integrity layer =====\n' >> apps-script/Code.gs
          cat apps-script/IntegrityV3.gs >> apps-script/Code.gs
          git rm apps-script/IntegrityV3.gs
          node --check apps-script/Code.gs
          ! grep -F 'syncDiary_(spreadsheet, payload.days || [])' apps-script/Code.gs
          ! grep -F 'syncDiaryFoodSnack_(spreadsheet, parsed.days)' apps-script/Code.gs
      - name: Commit merged Apps Script
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/Code.gs apps-script/IntegrityV3.gs
          git diff --cached --check
          git commit -m 'Bundle Apps Script schema v3 into one deployable file'
          git push origin HEAD:main
