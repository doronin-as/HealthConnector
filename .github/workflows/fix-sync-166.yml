name: Build signed 1.6.6 sync hotfix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-sync-166.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HC_SIGNING_STORE_FILE: /tmp/healthconnector-dev.keystore
      HC_SIGNING_STORE_PASSWORD: android
      HC_SIGNING_KEY_ALIAS: androiddebugkey
      HC_SIGNING_KEY_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply sync fixes in build workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path

          streamer = Path('app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt')
          text = streamer.read_text()
          text = text.replace(
              '''        days: Int,\n        onProgress: (String) -> Unit\n    ): SyncResult {''',
              '''        days: Int,\n        includeHistoricalChanges: Boolean = true,\n        onProgress: (String) -> Unit\n    ): SyncResult {''',
              1,
          )
          old = '''        // A DeletionChange contains only recordId, not its timestamp. Usually the server can\n        // recover the affected date from the raw row. To guarantee correctness even when that row\n        // was never exported by an older app version, any deletion triggers a rare 30-day rebuild.\n        val deletionSafetyDates = if (changes.deletedRecordIds.isNotEmpty()) {\n            (0L..29L).map { today.minusDays(it) }\n        } else {\n            emptyList()\n        }\n\n        val oldestReadable = today.minusDays(29)\n        val dates = linkedSetOf<LocalDate>().apply {\n            addAll(requestedDates)\n            addAll(changes.affectedDates)\n            addAll(deletionDates)\n            addAll(deletionSafetyDates)\n        }.filter { !it.isBefore(oldestReadable) && !it.isAfter(today) }\n            .distinct()\n            .sorted()\n'''
          new = '''        // Use exact affected dates returned by Health Connect / Apps Script. Never turn one\n        // deletion into an unconditional 30-day rebuild: periodic WorkManager jobs must stay bounded.\n        val requestedDateSet = requestedDates.toSet()\n        val affectedDates = if (includeHistoricalChanges) {\n            changes.affectedDates\n        } else {\n            changes.affectedDates.filterTo(linkedSetOf()) { it in requestedDateSet }\n        }\n        val mappedDeletionDates = if (includeHistoricalChanges) {\n            deletionDates\n        } else {\n            deletionDates.filterTo(linkedSetOf()) { it in requestedDateSet }\n        }\n\n        val oldestReadable = today.minusDays(29)\n        val dates = linkedSetOf<LocalDate>().apply {\n            addAll(requestedDates)\n            addAll(affectedDates)\n            addAll(mappedDeletionDates)\n        }.filter { !it.isBefore(oldestReadable) && !it.isAfter(today) }\n            .distinct()\n            .sorted()\n'''
          if old not in text:
              raise SystemExit('deletionSafetyDates block not found')
          streamer.write_text(text.replace(old, new, 1))

          worker = Path('app/src/main/java/ru/doronin/healthconnector/BackgroundSyncWorker.kt')
          text = worker.read_text()
          text = text.replace(
              'import androidx.work.WorkerParameters\n',
              'import androidx.work.WorkerParameters\nimport kotlinx.coroutines.CancellationException\n',
              1,
          )
          text = text.replace(
              '''                days = BackgroundSyncScheduler.BACKGROUND_DAYS,\n                onProgress = { }\n            )''',
              '''                days = BackgroundSyncScheduler.BACKGROUND_DAYS,\n                includeHistoricalChanges = false,\n                onProgress = { }\n            )''',
              1,
          )
          text = text.replace(
              '''            Result.success()\n        } catch (error: Throwable) {\n            saveBackgroundStatus("Ошибка: ${error.message ?: error.javaClass.simpleName}")\n            if (runAttemptCount < 3) Result.retry() else Result.failure()\n        }\n''',
              '''            Result.success()\n        } catch (cancelled: CancellationException) {\n            throw cancelled\n        } catch (error: Throwable) {\n            saveBackgroundStatus("Ошибка: ${error.message ?: error.javaClass.simpleName}")\n            if (runAttemptCount < 3) Result.retry() else Result.failure()\n        }\n''',
              1,
          )
          worker.write_text(text)

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text().replace('versionCode = 19', 'versionCode = 20', 1)
          text = text.replace('versionName = "1.6.5"', 'versionName = "1.6.6"', 1)
          gradle.write_text(text)
          PY

      - name: Validate patch
        run: |
          grep -F 'versionName = "1.6.6"' app/build.gradle.kts
          grep -F 'versionCode = 20' app/build.gradle.kts
          grep -F 'includeHistoricalChanges: Boolean = true' app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt
          grep -A1 -F 'includeHistoricalChanges: Boolean = true' app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt | grep -F 'onProgress: (String) -> Unit'
          grep -F 'includeHistoricalChanges = false' app/src/main/java/ru/doronin/healthconnector/BackgroundSyncWorker.kt
          grep -F 'catch (cancelled: CancellationException)' app/src/main/java/ru/doronin/healthconnector/BackgroundSyncWorker.kt
          ! grep -F 'deletionSafetyDates' app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore compatible signing key
        run: |
          git show d551c9b2e2c5250cc4658ef5629b4297984d03d9:.github/signing/healthconnector-dev.keystore.b64 > /tmp/healthconnector-dev.keystore.b64
          base64 --decode /tmp/healthconnector-dev.keystore.b64 > "$HC_SIGNING_STORE_FILE"
          chmod 600 "$HC_SIGNING_STORE_FILE"
          rm -f /tmp/healthconnector-dev.keystore.b64

      - name: Build signed APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify compatible signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-certs.txt
          grep -F '319c0e1944727ba1128e6a8340bd68123b9e8b2cf328b0443e1e4a0387a85a80' /tmp/apk-certs.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: health-connector-1.6.6-sync-hotfix
          path: app/build/outputs/apk/debug/app-debug.apk
