name: Build Health Connector 1.5.6

on:
  push:
    paths:
      - '.github/trigger-v156'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch wrapped permission failures
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt')
          s = p.read_text()

          pattern = re.compile(
              r'    private suspend inline fun <reified T : Record> safeReadAll\(start: Instant, end: Instant\): List<T> \{.*?'
              r'private suspend inline fun <reified T : Record> readAll\(start: Instant, end: Instant\): List<T> \{',
              re.S,
          )

          lines = [
              '    private suspend inline fun <reified T : Record> safeReadAll(start: Instant, end: Instant): List<T> {',
              '        var lastError: Exception? = null',
              '        repeat(HEALTH_CONNECT_READ_RETRIES) { attempt ->',
              '            try {',
              '                return readAll(start, end)',
              '            } catch (error: Exception) {',
              '                // Android may wrap SecurityException inside HealthConnectException.',
              '                // Missing permission for an optional metric must not abort the whole sync.',
              '                if (isPermissionFailure(error)) return emptyList()',
              '',
              '                lastError = error',
              '                if (attempt + 1 < HEALTH_CONNECT_READ_RETRIES) {',
              '                    delay(HEALTH_CONNECT_RETRY_BASE_MS * (attempt + 1L))',
              '                }',
              '            }',
              '        }',
              '        throw IllegalStateException(',
              '            "Health Connect: ошибка чтения ${T::class.simpleName}: ${lastError?.message ?: \\"неизвестная ошибка\\"}",',
              '            lastError',
              '        )',
              '    }',
              '',
              '    private fun isPermissionFailure(error: Throwable): Boolean {',
              '        var current: Throwable? = error',
              '        repeat(8) {',
              '            val value = current ?: return false',
              '            if (value is SecurityException) return true',
              '',
              '            val message = value.message.orEmpty()',
              '            if (',
              '                message.contains("SecurityException", ignoreCase = true) ||',
              '                message.contains("does not have permission", ignoreCase = true) ||',
              '                message.contains("permission to read data", ignoreCase = true) ||',
              '                message.contains("permission denied", ignoreCase = true)',
              '            ) {',
              '                return true',
              '            }',
              '            current = value.cause',
              '        }',
              '        return false',
              '    }',
              '',
              '    private suspend inline fun <reified T : Record> readAll(start: Instant, end: Instant): List<T> {',
          ]
          replacement = '\n'.join(lines)
          s, count = pattern.subn(lambda _: replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Expected one safeReadAll block, found {count}; refusing unsafe patch')
          p.write_text(s)

          g = Path('app/build.gradle.kts')
          b = g.read_text()
          if 'versionCode = 11' not in b or 'versionName = "1.5.5"' not in b:
              raise SystemExit('Unexpected app version; refusing unsafe patch')
          b = b.replace('versionCode = 11', 'versionCode = 12', 1)
          b = b.replace('versionName = "1.5.5"', 'versionName = "1.5.6"', 1)
          g.write_text(b)
          PY

      - name: Commit 1.5.6
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt app/build.gradle.kts
          git diff --cached --check
          git commit -m 'Handle wrapped Health Connect permission failures in 1.5.6'
          git push origin HEAD:main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable development signing key
        run: |
          base64 --decode .github/signing/healthconnector-dev.keystore.b64 > app/healthconnector-dev.keystore
          chmod 600 app/healthconnector-dev.keystore
          keytool -list -v \
            -keystore app/healthconnector-dev.keystore \
            -storepass android \
            -alias androiddebugkey | grep -F "31:9C:0E:19:44:72:7B:A1:12:8E:6A:83:40:BD:68:12:3B:9E:8B:2C:F3:28:B0:44:3E:1E:4A:03:87:A8:5A:80"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-certs.txt
          grep -F "319c0e1944727ba1128e6a8340bd68123b9e8b2cf328b0443e1e4a0387a85a80" /tmp/apk-certs.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: health-connector-1.5.6
          path: app/build/outputs/apk/debug/app-debug.apk
