name: Patch Health Connector 1.5.5

on:
  push:
    paths:
      - '.github/trigger-v155'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden Health Connect reads
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt')
          s = p.read_text()

          s = s.replace(
              'import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.withContext',
              'import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.delay\nimport kotlinx.coroutines.withContext'
          )
          s = s.replace(
              '        var stepsTotal = 0L\n        var distanceKm = 0.0',
              '        var stepsTotal = 0L\n        var hasStepRecords = false\n        var distanceKm = 0.0'
          )
          s = s.replace(
              '            stepsTotal = records.sumOf { it.count }\n            for (r in records) emit("Steps", null, r.startTime, r.endTime, r.count, "steps", r)',
              '            hasStepRecords = records.isNotEmpty()\n            stepsTotal = records.sumOf { it.count }\n            for (r in records) emit("Steps", null, r.startTime, r.endTime, r.count, "steps", r)'
          )

          pattern = re.compile(
              r'    private suspend inline fun <reified T : Record> safeReadAll\(start: Instant, end: Instant\): List<T> \{.*?\n    \}\n\n    private suspend inline fun <reified T : Record> readAll',
              re.S
          )
          replacement = '''    private suspend inline fun <reified T : Record> safeReadAll(start: Instant, end: Instant): List<T> {
              var lastError: Exception? = null
              repeat(HEALTH_CONNECT_READ_RETRIES) { attempt ->
                  try {
                      return readAll(start, end)
                  } catch (_: SecurityException) {
                      return emptyList()
                  } catch (error: Exception) {
                      lastError = error
                      if (attempt + 1 < HEALTH_CONNECT_READ_RETRIES) {
                          delay(HEALTH_CONNECT_RETRY_BASE_MS * (attempt + 1L))
                      }
                  }
              }
              throw IllegalStateException(
                  "Health Connect: ошибка чтения ${T::class.simpleName}: ${lastError?.message ?: "неизвестная ошибка"}",
                  lastError
              )
          }

          private suspend inline fun <reified T : Record> readAll'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'safeReadAll structural patch count={count}; refusing unsafe patch')

          marker = '        // Make sure the final partial measurement batch is persisted before the day summary.\n        batcher.flush()'
          guarded = '''        if (!hasStepRecords) {
              onProgress("Health Connect не вернул шаги за $date — существующая сводка сохранена")
              batcher.flush()
              return DayResult(
                  workouts = workoutRecords.size,
                  measurements = batcher.totalCount,
                  sources = sources
              )
          }

          // Make sure the final partial measurement batch is persisted before the day summary.
          batcher.flush()'''
          if marker not in s:
              raise SystemExit('summary marker not found; refusing unsafe patch')
          s = s.replace(marker, guarded, 1)

          day_marker = '            allSources += result.sources\n        }'
          if day_marker not in s:
              raise SystemExit('day loop marker not found; refusing unsafe patch')
          s = s.replace(
              day_marker,
              '            allSources += result.sources\n            if (offset + 1 < safeDays) delay(HEALTH_CONNECT_DAY_PAUSE_MS)\n        }',
              1
          )

          constants = '        private const val HEALTH_CONNECT_PAGE_SIZE = 200\n        private const val MAX_MEASUREMENTS_PER_REQUEST = 2000'
          if constants not in s:
              raise SystemExit('constants marker not found; refusing unsafe patch')
          s = s.replace(
              constants,
              constants + '\n        private const val HEALTH_CONNECT_READ_RETRIES = 3\n        private const val HEALTH_CONNECT_RETRY_BASE_MS = 750L\n        private const val HEALTH_CONNECT_DAY_PAUSE_MS = 1000L',
              1
          )
          p.write_text(s)

          g = Path('app/build.gradle.kts')
          b = g.read_text()
          if 'versionCode = 10' not in b or 'versionName = "1.5.4"' not in b:
              raise SystemExit('unexpected version; refusing patch')
          b = b.replace('versionCode = 10', 'versionCode = 11').replace('versionName = "1.5.4"', 'versionName = "1.5.5"')
          g.write_text(b)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt app/build.gradle.kts
          git diff --cached --check
          git commit -m 'Harden Health Connect reads in 1.5.5'
          git push origin HEAD:main
