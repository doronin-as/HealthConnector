name: Activate Drive daily archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-drive-archive.yml'

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing deployment client
        run: npm install --global @google/clasp@3.4.1
      - name: Activate archive using existing Google authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPS_SCRIPT_ID"
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          TASK_DIR="$RUNNER_TEMP/archive-activation"
          mkdir -p "$TASK_DIR"
          cd "$TASK_DIR"
          node -e 'require("fs").writeFileSync(".clasp.json",JSON.stringify({scriptId:process.env.APPS_SCRIPT_ID,rootDir:"."}))'
          clasp pull
          node <<'JS'
          const fs = require('fs');
          const file = 'appsscript.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log('API executable configured:', Boolean(manifest.executionApi));
          if (!manifest.executionApi) {
            manifest.executionApi = {access: 'MYSELF'};
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2));
            fs.writeFileSync('.needs-api-deployment', '1');
          }
          JS
          if [[ -f .needs-api-deployment ]]; then
            clasp push --force
            clasp create-deployment --description "Owner-only archive maintenance API" --json > "$RUNNER_TEMP/archive-api-deployment.json"
          fi
          clasp run installDriveArchiveV1 --json > "$RUNNER_TEMP/archive-install.json"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/archive-install.json","utf8")); if(r.error || !r.response || r.response.enabled!==true){console.error(JSON.stringify(r));process.exit(1)};console.log(JSON.stringify(r.response));'
      - name: Run first verified migration batch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/archive-activation"
          clasp run archiveDashboardHistoryV1 --json > "$RUNNER_TEMP/archive-migrate.json"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/archive-migrate.json","utf8")); if(r.error || !r.response || r.response.ok===false){console.error(JSON.stringify(r));process.exit(1)};console.log(JSON.stringify(r.response));'
          clasp run driveArchiveStatusV1 --json > "$RUNNER_TEMP/archive-status.json"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/archive-status.json","utf8")); if(r.error || !r.response || r.response.enabled!==true){console.error(JSON.stringify(r));process.exit(1)};console.log(JSON.stringify(r.response));'
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json"
