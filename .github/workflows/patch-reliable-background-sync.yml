name: Patch reliable background sync

on:
  push:
    branches: [ feat/reliable-background-sync ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reliable-background-sync
      - name: Apply reliable background sync patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text().replace('versionCode = 29','versionCode = 30').replace('versionName = "1.6.15"','versionName = "1.6.16"')
          p.write_text(s)

          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools">')
          s = s.replace('    <uses-permission android:name="android.permission.INTERNET" />','    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />')
          marker = '        <activity\n            android:name=".StreamingMainActivity"'
          service = '        <service\n            android:name="androidx.work.impl.foreground.SystemForegroundService"\n            android:foregroundServiceType="dataSync"\n            tools:node="merge" />\n\n'
          if service not in s: s = s.replace(marker, service + marker)
          p.write_text(s)

          p = Path('app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt')
          s = p.read_text()
          s = s.replace('                    val connection = URL(safeEndpoint).openConnection() as HttpURLConnection\n                    try {','                    val connection = URL(safeEndpoint).openConnection() as HttpURLConnection\n                    try {\n                        connection.instanceFollowRedirects = true')
          s = s.replace('            "http 429" in value ||','            "http 404" in value ||\n            "http 429" in value ||')
          p.write_text(s)

          p = Path('app/src/main/java/ru/doronin/healthconnector/StreamingMainActivity.kt')
          s = p.read_text()
          old = '''        binding.sync.setOnClickListener {\n            val settings = saveSettingsFromForm()\n            lifecycleScope.launch { synchronize(settings) }\n        }'''
          new = '''        binding.sync.setOnClickListener {\n            val settings = saveSettingsFromForm()\n            if (settings.endpoint.isBlank() || settings.token.isBlank()) {\n                binding.status.text = "Укажи URL Apps Script и токен"\n            } else {\n                ManualSyncScheduler.enqueue(this)\n                binding.status.text = "Синхронизация запущена в фоне · приложение можно свернуть"\n            }\n        }\n        setupManualSyncObserver()'''
          if old not in s: raise SystemExit('manual click block not found')
          s = s.replace(old,new)
          insert_before='    private fun setupVersionBadge() {'
          observer='''    private fun setupManualSyncObserver() {\n        androidx.work.WorkManager.getInstance(this)\n            .getWorkInfosForUniqueWorkLiveData(ManualSyncScheduler.UNIQUE_WORK_NAME)\n            .observe(this) { works ->\n                val work = works.lastOrNull() ?: return@observe\n                val progress = work.progress.getString(ManualSyncWorker.KEY_PROGRESS).orEmpty()\n                when (work.state) {\n                    androidx.work.WorkInfo.State.ENQUEUED, androidx.work.WorkInfo.State.BLOCKED ->\n                        binding.status.text = "Синхронизация ожидает запуска · можно свернуть приложение"\n                    androidx.work.WorkInfo.State.RUNNING ->\n                        binding.status.text = if (progress.isBlank()) "Синхронизация выполняется в фоне · можно свернуть приложение" else "$progress\\n● Фоновая работа активна"\n                    androidx.work.WorkInfo.State.SUCCEEDED -> {\n                        val days = work.outputData.getInt(ManualSyncWorker.KEY_DAYS, -1)\n                        val measurements = work.outputData.getInt(ManualSyncWorker.KEY_MEASUREMENTS, -1)\n                        if (days >= 0) binding.status.text = "Синхронизация завершена: дней $days, измерений $measurements"\n                    }\n                    androidx.work.WorkInfo.State.FAILED -> {\n                        val error = work.outputData.getString(ManualSyncWorker.KEY_ERROR) ?: "неизвестная ошибка"\n                        binding.status.text = "Ошибка синхронизации: $error"\n                    }\n                    androidx.work.WorkInfo.State.CANCELLED -> binding.status.text = "Синхронизация отменена системой"\n                }\n            }\n    }\n\n'''
          if observer not in s: s=s.replace(insert_before,observer+insert_before)
          p.write_text(s)

          p=Path('app/src/main/java/ru/doronin/healthconnector/BackgroundSyncWorker.kt')
          s=p.read_text()
          anchor='        return try {\n            val syncResult = SyncRunGate.tryRunBackground {'
          repl='''        setForeground(\n            SyncForeground.info(applicationContext, SyncForeground.BACKGROUND_NOTIFICATION_ID, "HealthConnector · фоновая синхронизация", "Подготовка данных Health Connect…")\n        )\n\n        return try {\n            val syncResult = SyncRunGate.tryRunBackground {'''
          if anchor not in s: raise SystemExit('background anchor not found')
          s=s.replace(anchor,repl)
          oldp='''                        onProgress = { message ->\n                            SyncDiagnostics.progress(applicationContext, runId, "background", message)\n                        }'''
          newp='''                        onProgress = { message ->\n                            SyncDiagnostics.progress(applicationContext, runId, "background", message)\n                            SyncForeground.update(applicationContext, SyncForeground.BACKGROUND_NOTIFICATION_ID, "HealthConnector · фоновая синхронизация", message)\n                        }'''
          if oldp not in s: raise SystemExit('background progress block not found')
          s=s.replace(oldp,newp)
          p.write_text(s)
          PY

          cat > app/src/main/java/ru/doronin/healthconnector/SyncForeground.kt <<'EOF'
          package ru.doronin.healthconnector

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.ServiceInfo
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import androidx.work.ForegroundInfo

          object SyncForeground {
              const val MANUAL_NOTIFICATION_ID = 16160
              const val BACKGROUND_NOTIFICATION_ID = 16161
              private const val CHANNEL_ID = "health_connector_sync"
              fun info(context: Context, id: Int, title: String, text: String): ForegroundInfo { ensureChannel(context); val n=notification(context,title,text); return if (Build.VERSION.SDK_INT>=Build.VERSION_CODES.Q) ForegroundInfo(id,n,ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC) else ForegroundInfo(id,n) }
              fun update(context: Context, id: Int, title: String, text: String) { ensureChannel(context); context.getSystemService(NotificationManager::class.java).notify(id,notification(context,title,text)) }
              private fun notification(context: Context, title: String, text: String)=NotificationCompat.Builder(context,CHANNEL_ID).setSmallIcon(R.drawable.ic_app_logo).setContentTitle(title).setContentText(text.take(120)).setStyle(NotificationCompat.BigTextStyle().bigText(text)).setOngoing(true).setOnlyAlertOnce(true).setSilent(true).setContentIntent(PendingIntent.getActivity(context,0,Intent(context,StreamingMainActivity::class.java).apply { flags=Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP },PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)).build()
              private fun ensureChannel(context: Context) { if (Build.VERSION.SDK_INT<Build.VERSION_CODES.O) return; val manager=context.getSystemService(NotificationManager::class.java); if (manager.getNotificationChannel(CHANNEL_ID)!=null) return; manager.createNotificationChannel(NotificationChannel(CHANNEL_ID,"Синхронизация HealthConnector",NotificationManager.IMPORTANCE_LOW).apply { description="Ход длительной синхронизации Health Connect"; setSound(null,null) }) }
          }
          EOF

          cat > app/src/main/java/ru/doronin/healthconnector/ManualSyncScheduler.kt <<'EOF'
          package ru.doronin.healthconnector
          import android.content.Context
          import androidx.work.*
          import java.util.concurrent.TimeUnit
          object ManualSyncScheduler { const val UNIQUE_WORK_NAME="health_connector_manual_sync"; fun enqueue(context: Context) { val request=OneTimeWorkRequestBuilder<ManualSyncWorker>().setConstraints(Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build()).setBackoffCriteria(BackoffPolicy.EXPONENTIAL,30,TimeUnit.SECONDS).build(); WorkManager.getInstance(context.applicationContext).enqueueUniqueWork(UNIQUE_WORK_NAME,ExistingWorkPolicy.KEEP,request) } }
          EOF

          cat > app/src/main/java/ru/doronin/healthconnector/ManualSyncWorker.kt <<'EOF'
          package ru.doronin.healthconnector
          import android.content.Context
          import android.os.SystemClock
          import androidx.health.connect.client.HealthConnectClient
          import androidx.health.connect.client.HealthConnectFeatures
          import androidx.health.connect.client.permission.HealthPermission
          import androidx.work.*
          import kotlinx.coroutines.CancellationException
          class ManualSyncWorker(appContext: Context, workerParams: WorkerParameters) : CoroutineWorker(appContext, workerParams) {
              override suspend fun doWork(): Result { val prefs=applicationContext.getSharedPreferences("settings",Context.MODE_PRIVATE); val endpoint=prefs.getString("endpoint","").orEmpty().trim(); val token=SecureTokenStore(applicationContext).getToken().trim(); val days=prefs.getInt("days",7).coerceIn(1,30); if(endpoint.isBlank()||token.isBlank()) return failure("Не настроены URL Apps Script или токен"); val safeEndpoint=runCatching{EndpointSecurity.requireHttps(endpoint)}.getOrElse{return failure(it.message?:"Некорректный URL Apps Script")}; if(HealthConnectClient.getSdkStatus(applicationContext)!=HealthConnectClient.SDK_AVAILABLE) return failure("Health Connect недоступен"); val client=HealthConnectClient.getOrCreate(applicationContext); val bgFeature=client.features.getFeatureStatus(HealthConnectFeatures.FEATURE_READ_HEALTH_DATA_IN_BACKGROUND); if(bgFeature==HealthConnectFeatures.FEATURE_STATUS_AVAILABLE){ val granted=runCatching{client.permissionController.getGrantedPermissions()}.getOrElse{return failure("Не удалось проверить разрешения Health Connect")}; if(HealthPermission.PERMISSION_READ_HEALTH_DATA_IN_BACKGROUND !in granted) return failure("Разреши Health Connect чтение данных в фоне") }; setForeground(SyncForeground.info(applicationContext,SyncForeground.MANUAL_NOTIFICATION_ID,"HealthConnector · синхронизация","Запуск… приложение можно свернуть")); val runId=SyncDiagnostics.begin(applicationContext,"manual"); val startedAt=SystemClock.elapsedRealtime(); return try { val result=SyncRunGate.runManual(onWaiting={running->val m="Ожидаю завершения ${running?:"другой"} синхронизации…";publish(m);SyncDiagnostics.progress(applicationContext,runId,"manual",m)}) { HealthSyncStreamer(applicationContext,client).sync(endpoint=safeEndpoint,token=token,days=days,includeHistoricalChanges=true,onProgress={message->val elapsed=(SystemClock.elapsedRealtime()-startedAt)/1000L;publish("$message · ${elapsed} с");SyncDiagnostics.progress(applicationContext,runId,"manual",message)}) }; if(result==null){SyncDiagnostics.skipped(applicationContext,"manual","Повторный ручной запуск не создан");Result.success()} else { val now=System.currentTimeMillis(); prefs.edit().putLong("dashboard_last_sync",now).putInt("dashboard_last_days",result.days).putInt("dashboard_last_workouts",result.workouts).putInt("dashboard_last_measurements",result.measurements).putInt("dashboard_last_sources",result.sources).putBoolean("dashboard_sheets_ok",true).apply(); SyncDiagnostics.finish(applicationContext,runId,"manual","Дней ${result.days}, тренировок ${result.workouts}, измерений ${result.measurements}"); Result.success(workDataOf(KEY_DAYS to result.days,KEY_WORKOUTS to result.workouts,KEY_MEASUREMENTS to result.measurements,KEY_SOURCES to result.sources)) } } catch(cancelled:CancellationException){SyncDiagnostics.skipped(applicationContext,"manual","Foreground-задание отменено системой");throw cancelled} catch(error:Throwable){SyncDiagnostics.failure(applicationContext,runId,"manual",error);failure(error.message?:error.javaClass.simpleName)} }
              private fun publish(message:String){setProgressAsync(workDataOf(KEY_PROGRESS to message));SyncForeground.update(applicationContext,SyncForeground.MANUAL_NOTIFICATION_ID,"HealthConnector · синхронизация",message)}
              private fun failure(message:String):Result=Result.failure(Data.Builder().putString(KEY_ERROR,message).build())
              companion object{const val KEY_PROGRESS="progress";const val KEY_ERROR="error";const val KEY_DAYS="days";const val KEY_WORKOUTS="workouts";const val KEY_MEASUREMENTS="measurements";const val KEY_SOURCES="sources"}
          }
          EOF

      - name: Commit patch
        run: |
          git config user.name "Alexander"
          git config user.email "53084491+doronin-as@users.noreply.github.com"
          git add app
          git commit -m "Run sync reliably in foreground workers"
          git push origin feat/reliable-background-sync
# trigger
