name: Patch dashboard sync safety 1.6.25

on:
  push:
    paths:
      - '.github/trigger-dashboard-sync-safety-1625'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve complete dashboard data during partial sync
        run: python3 tools/patch_dashboard_sync_safety_1625.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/Code.gs app/src/main/java/ru/doronin/healthconnector/HealthSyncStreamer.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Patch already applied'
            exit 0
          fi
          git commit -m 'Preserve dashboard fields during partial Health Connect sync'
          git push origin "HEAD:${GITHUB_REF_NAME}"
